name: Refresh education news

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh news snapshot
        run: node scripts/update-education-news.mjs

      - name: Publish updated snapshot
        shell: bash
        run: |
          if git diff --quiet -- public/data/education-news.json; then
            echo "News is already current."
            exit 0
          fi
          git config user.name "NGA News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/education-news.json
          git commit -m "Refresh education news snapshot"
          git push
